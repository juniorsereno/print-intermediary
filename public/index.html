<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Impressão - Soli Pizzaria</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .status.connected {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status.disconnected {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .log {
            text-align: left;
            background: #1e1e1e;
            color: #00ff00;
            padding: 1rem;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.2rem;
        }
        .info {
            font-size: 0.8rem;
            color: #666;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Monitor de Impressão</h2>
        <div id="status" class="status disconnected">Desconectado</div>
        <p>Mantenha esta página aberta para receber os pedidos.</p>
        
        <div class="log" id="log">
            <!-- Logs will appear here -->
        </div>

        <div class="info">
            Arquivos serão baixados automaticamente para a pasta Downloads.
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('log');

        // Preload the alert sound
        const alertAudio = new Audio('/ding-sound-effect_2.mp3');
        
        function playAlertSound() {
            alertAudio.currentTime = 0;
            alertAudio.play().catch(err => {
                console.warn('Could not play alert sound:', err);
            });
        }

        function addLog(message) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
        }

        socket.on('connect', () => {
            statusEl.textContent = 'Conectado';
            statusEl.className = 'status connected';
            addLog('Conectado ao servidor');
        });

        socket.on('disconnect', () => {
            statusEl.textContent = 'Desconectado';
            statusEl.className = 'status disconnected';
            addLog('Desconectado do servidor');
        });

        socket.on('download', (data) => {
            addLog(`Recebido pedido para impressão`);
            playAlertSound();
            downloadFile('pedido.saiposprt', data);
        });

        socket.on('print_both', (data) => {
            addLog(`Recebido pedido para impressão (2 vias)`);
            playAlertSound();
            // Download counter copy (full)
            downloadFile('pedido_balcao.saiposprt', data.full);
            // Small delay before downloading kitchen copy
            setTimeout(() => {
                downloadFile('pedido_cozinha.saiposprt', data.kitchen);
            }, 500);
        });

        function downloadFile(filename, content) {
            try {
                const element = document.createElement('a');
                
                // If content is a Data URI, use it directly. Otherwise create blob.
                if (content.startsWith('data:')) {
                    element.href = content;
                } else {
                    const file = new Blob([content], {type: 'text/plain'});
                    element.href = URL.createObjectURL(file);
                }
                
                element.download = filename;
                document.body.appendChild(element); // Required for FireFox
                element.click();
                document.body.removeChild(element);
                addLog(`Download iniciado: ${filename}`);
            } catch (err) {
                console.error(err);
                addLog(`Erro ao baixar: ${err.message}`);
            }
        }
    </script>
</body>
</html>
